<div class="header">
  <h2>Comment LIst</h2>
</div>

<hr class="center-square">


<div class="table-container">
  <table>
    <thead>
      <tr class="table-head">
        <th scope="col">{{'Activities Image'}}</th>
        <th scope="col">{{'Activities Name'}}</th>
        <th scope="col">{{'User Name'}}</th>
        <th scope="col">{{'Comment Date'}}</th>
        <th scope="col">{{'Comment'}}</th>
        <th scope="col">{{'Status'}}</th>
        <!--      <th scope="col">{{'Rating'}}</th>-->
        <th scope="col">{{'Action'}}</th>
      </tr>
    </thead> <!-- End Table Head -->
    <tr *ngFor="let data of allComments; let i = index">
      <td [attr.data-label]="'Product Image'">
        <img
          [src]="data.activities?.image && data.activities.image.length > 0 ? data.activities?.image : '/images/placeholder/test.png'"
          alt="" class="img-thumb">
      </td>
      <td [attr.data-label]="'Activities Name'">{{data.activities?.name}}</td>
      <td [attr.data-label]="'User Name'">{{data.name}}</td>
      <td [attr.data-label]="'Comment Date'">{{data?.reviewDate | date}}</td>
      <td [attr.data-label]="'Comment'">{{data.review }}</td>
      <td [attr.data-label]="'Status'">{{ data.status ? 'Approved' : 'Not Approved' }}</td>
      <!--      <td [attr.data-label]="'Rating'">{{data.rating}}</td>-->

      <!--      <td [attr.data-label]="'createdAt'">{{data.createdAt | date}}</td>-->
      <!--      <td [attr.data-label]="'Attributes'">{{data.attributes}}</td>-->
      <td [attr.data-label]="'Actions'">
        <button style="margin-right: 5px;" mat-mini-fab color="warn" (click)="openConfirmDialog(data._id)">
          <mat-icon>delete</mat-icon>
        </button>
        <button style="margin-right: 5px;" [routerLink]="['../../activities-comment/edit-activities-comment', data._id]"
          mat-mini-fab>
          <mat-icon>reply</mat-icon>
        </button>
        <!--        <button mat-mini-fab color="primary" (click)="openComponentDialog(data.activities)">-->
        <!--          <mat-icon>visibility</mat-icon>-->
        <!--        </button>-->
      </td>
    </tr><!-- End Table Body -->
  </table>
</div>
