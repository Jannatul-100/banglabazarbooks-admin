<section class="add-list">
    <div class="page-header">
      <div class="page-title">
        <h4>Publisher {{ id ? "Update" : "Add" }}</h4>
      </div>
      <div class="checkbox">
        <mat-checkbox [(ngModel)]="autoSlug" (change)="autoGenerateSlug()" color="primary">Auto Slug</mat-checkbox>
      </div>
    </div>
  </section>

<section class="from-section">
  <div class="grid">
    <form #formElement="ngForm" [formGroup]="dataForm" (ngSubmit)="onSubmit()" class="area-border">


      <div class="form-img-avatar">
        <img matTooltip="Main Banner Image" (click)="openGalleryDialog('image')" [src]="pickedImage" alt="">
        <!--      <img matTooltip="Mobile Banner Image" (click)="openGalleryDialog('mobileImage')" [src]="pickedMobileImage" alt="">-->
      </div>


      <div class="from">
        <mat-label>Publisher Name</mat-label>
        <mat-form-field appearance="outline">
          <input formControlName="name" matInput required/>
          <mat-error>This field is required.</mat-error>
        </mat-form-field>
      </div>

      <div class="from">
        <mat-label>Publisher Name (English)</mat-label>
        <mat-form-field appearance="outline">
          <input formControlName="nameEn" matInput />
        </mat-form-field>
      </div>

      <div class="from">
        <mat-label>Slug</mat-label>
        <mat-form-field appearance="outline">
          <input formControlName="slug" matInput required autoSlug />
          <mat-error>This field is required.</mat-error>
        </mat-form-field>
      </div>

      <div class="from">
        <p>Description</p>
        <quill-editor class="q-editor"
          [styles]="{height: '250px'}"
          formControlName="description"></quill-editor>
      </div>

      <div class="from">
        <p>Description (English)</p>
        <quill-editor class="q-editor"
          [styles]="{height: '250px'}"
          formControlName="descriptionEn"></quill-editor>
      </div>

      <div class="from">
        <mat-label>Purchase Percent (Profit %)</mat-label>
        <mat-form-field appearance="outline">
          <input formControlName="profitPercent" type="number" matInput />
        </mat-form-field>
      </div>

      <div class="from">
        <mat-label>Priority</mat-label>
        <mat-form-field appearance="outline">
          <input formControlName="priority" matInput />
        </mat-form-field>
      </div>

      <div class="from">
        <mat-label>Discount Type</mat-label>
        <mat-form-field appearance="outline">
          <mat-select formControlName="discountType">
            <mat-option *ngFor="let data of discountTypes" [value]="data.value">
              {{ data.viewValue }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="from">
        <mat-label>Discount Amount</mat-label>
        <mat-form-field appearance="outline">
          <input formControlName="discountAmount" type="number" matInput />
        </mat-form-field>
      </div>


      <div class="btn">
        <button mat-raised-button type="submit" class="btn-submit">
          {{ id ? "Update" : "Submit" }}
        </button>
        <button type="button" [routerLink]="['../']" mat-raised-button class="btn-submit color">
          Cancel
        </button>
      </div>
    </form>
  </div>
</section>
