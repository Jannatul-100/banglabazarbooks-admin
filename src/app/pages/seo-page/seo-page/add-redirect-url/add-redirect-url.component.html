<section class="add-list">
  <div class="page-header">
    <div class="page-title">
      <h4>RedirectUrl {{ id ? "Update" : "Add" }}</h4>
    </div>
  </div>
</section>

<section class="from-section">
  <div class="grid">
    <form #formElement="ngForm" [formGroup]="dataForm" (ngSubmit)="onSubmit()" class="area-border">

      <div class="from">
        <mat-label>RedirectUrl name</mat-label>
        <mat-form-field appearance="outline">
          <input formControlName="name" matInput required/>
          <mat-error>This field is required.</mat-error>
        </mat-form-field>
      </div>

      <div class="from">
        <mat-label>From Url</mat-label>
        <mat-form-field appearance="outline">
          <input formControlName="fromUrl" placeholder="Ex-slug or id" matInput required/>
          <mat-error>This field is required.</mat-error>
        </mat-form-field>
      </div>


      <div class="from">
        <mat-label>To Url</mat-label>
        <mat-form-field appearance="outline">
          <input formControlName="toUrl" matInput required/>
          <mat-error>This field is required.</mat-error>
        </mat-form-field>
      </div>

      <div class="btn">
        <button mat-raised-button type="submit" class="btn-submit">
          {{ id ? "Update" : "Submit" }}
        </button>
        <button type="button" [routerLink]="['../']" mat-raised-button class="btn-submit color">
          Cancel
        </button>
      </div>
    </form>
  </div>
</section>
