<section class="add-list">
  <div class="page-header">
    <div class="page-title">
      <h4>Praptisthana {{ id ? "Update" : "Add" }}</h4>
    </div>
  </div>
</section>

<section class="from-section">
  <form #formElement="ngForm" [formGroup]="dataForm" (ngSubmit)="onSubmit()" class="area-border">



    <div class="form-img-avatar">
      <!-- <img matTooltip="Main Praptisthana Image" (click)="openGalleryDialog('image')" [src]="pickedImage" alt=""> -->
<!--      <img matTooltip="Mobile Praptisthana Image" (click)="openGalleryDialog('mobileImage')" [src]="pickedMobileImage" alt="">-->
    </div>



    <div class="from">
      <mat-label>Name</mat-label>
      <mat-form-field appearance="outline">
        <input formControlName="name" matInput required />
        <mat-error>This field is required.</mat-error>
      </mat-form-field>
    </div>


    <div class="from">
      <mat-label>Slug</mat-label>
      <mat-form-field appearance="outline">
        <input formControlName="slug" matInput required autoSlug/>
        <mat-error>This field is required.</mat-error>
      </mat-form-field>
    </div>

    <div class="from">
      <mat-form-field appearance="outline">
        <mat-label>Select District</mat-label>
        <mat-select
          formControlName="division"
          (selectionChange)="onDivisionSelect($event)"
          required
        >
          <mat-option
            [value]="d?._id"
            *ngFor="let d of divisions"
          >{{ d?.name }}</mat-option
          >
          <!--                                                <mat-option value="dhaka">Dhaka</mat-option>-->
          <!--                                                <mat-option value="khulna">Khulna</mat-option>-->
          <!--                                                <mat-option value="feni">Feni</mat-option>-->
        </mat-select>
      </mat-form-field>
    </div>


    <div class="from">
      <mat-form-field appearance="outline">
        <mat-label>Select Area</mat-label>
        <mat-select
          formControlName="area"
          (selectionChange)="onChangeArea($event)"
          required
        >
          <mat-option [value]="a?._id" *ngFor="let a of area">{{
            a?.name
            }}</mat-option>
          <!--                                                <mat-option value="sonagazi">Sonagazi</mat-option>-->
          <!--                                                <mat-option value="dagon_Bhuiya">Dagon Bhuiya</mat-option>-->
          <!--                                                <mat-option value="full_gazi">Full Gazi</mat-option>-->
        </mat-select>
      </mat-form-field>
    </div>

    <div class="from">
      <mat-form-field appearance="outline">
        <mat-label>Select Zone(Optional)</mat-label>
        <mat-select formControlName="zone">
          <mat-option [value]="z?._id" *ngFor="let z of zone">{{
            z?.name
            }}</mat-option>
          <!--                                                <mat-option value="sonagazi">Sonagazi</mat-option>-->
          <!--                                                <mat-option value="dagon_Bhuiya">Dagon Bhuiya</mat-option>-->
          <!--                                                <mat-option value="full_gazi">Full Gazi</mat-option>-->
        </mat-select>
      </mat-form-field>
    </div>

    <div class="from">
      <mat-form-field appearance="outline">
        <mat-label>Phone </mat-label>
        <input formControlName="phone" matInput/>
        <mat-error>This field is required</mat-error>
      </mat-form-field>
    </div>

    <div class="from">
      <mat-form-field appearance="outline">
        <mat-label>Address </mat-label>
        <textarea
          matInput
          cols="10"
          rows="5"
          formControlName="address"
          required
        ></textarea>
        <mat-error>This field is required</mat-error>
      </mat-form-field>
    </div>

    <div class="from">
      <mat-label>Priority</mat-label>
      <mat-form-field appearance="outline">
        <input formControlName="priority" matInput/>
        <mat-error>This field is required.</mat-error>
      </mat-form-field>
    </div>


    <div class="btn">
      <button mat-raised-button type="submit" class="btn-submit">
        {{ id ? "Update" : "Submit" }}
      </button>
      <button type="button" [routerLink]="['../']" mat-raised-button class="btn-submit color">
        Cancel
      </button>
    </div>
  </form>
</section>
